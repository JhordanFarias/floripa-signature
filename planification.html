<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floripa Port | Expériences Premium au Brésil</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="form-hero">

    <video autoplay muted loop playsinline class="hero-video">
        <source src="videos/floripa.mp4" type="video/mp4">
    </video>

    <div class="hero-overlay"></div>

    <nav>
        <div class="logo">Floripa Signature</div>
        <ul>
            <li><a href="index.html">Retour</a></li>
        </ul>
    </nav>

    <div class="form-hero-content">
        <span class="mini-label">PLANIFICATION</span>
        <h1>
            Chaque expérience<br>
            commence par une intention.
        </h1>
        <p>
            Décrivez le voyage idéal que vous imaginez.
            Nous concevrons ensuite une expérience pensée
            dans les moindres détails.
        </p>
    </div>

</header>

<section class="planning-form-section">

    <iframe name="hidden-frame" style="display:none;"></iframe>

    <form
        class="planning-form"
        action="https://docs.google.com/forms/d/e/1FAIpQLScAxAo0OwRIBunYToIym3G5GOAAs7U9iPQVWy-7t1yfSyt27g/formResponse"
        method="POST"
        target="hidden-frame"
        id="planning-form"
    >

        <!-- ── INFORMATIONS PERSONNELLES ── -->

        <div class="form-group">
            <label>Nom complet</label>
            <input type="text" name="entry.561873876" placeholder="Votre nom" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="entry.2061567683" placeholder="Votre email" required>
        </div>

        <div class="form-group">
            <label>Téléphone</label>
            <input type="text" name="entry.293371493" placeholder="Votre téléphone" required>
        </div>

   <div class="form-group">
            <label>Comment préférez-vous être contacté(e) ?</label>
            <select name="entry.2003445671">
                <option>WhatsApp</option>
                <option>Email</option>
                <option>Appel vidéo (Zoom / Google Meet)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ville de départ</label>
            <input type="text" name="entry.2146533686" placeholder="Ex : Québec, Montréal, Paris...">
        </div>

        <!-- ── PROFIL DU VOYAGE ── -->

        <div class="form-group">
            <label>État civil</label>
            <select name="entry.1047477737">
                <option>Marié(e)</option>
                <option>En couple</option>
                <option>Célibataire</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nombre de voyageurs (adultes)</label>
            <select name="entry.1177933152">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5+</option>
            </select>
        </div>

        <div class="form-group">
            <label>Voyage avec enfants ?</label>
            <select name="entry.613396317">
                <option>Non</option>
                <option>1 enfant</option>
                <option>2 enfants</option>
                <option>3 enfants</option>
                <option>4+ enfants</option>
            </select>
        </div>

        <div class="form-group">
            <label>Un des voyageurs a-t-il une mobilité réduite ou un besoin particulier ?</label>
            <select name="entry.1945372475">
                <option>Non</option>
                <option>Oui (merci de préciser dans les notes)</option>
            </select>
        </div>

        <!-- ── DATES ET DURÉE ── -->

        <div class="form-group">
            <label>Période souhaitée</label>
            <input type="text" name="entry.1395998712" placeholder="Ex : janvier 2026, été 2026...">
        </div>

        <div class="form-group">
            <label>Durée du séjour</label>
            <select name="entry.269165958">
                <option>Moins d'une semaine</option>
                <option>1 semaine</option>
                <option>2 semaines</option>
                <option>3 semaines</option>
                <option>1 mois ou plus</option>
            </select>
        </div>

        <!-- ── MOTIVATION ET AMBIANCE ── -->

        <div class="form-group">
            <label>Motif principal du voyage</label>
            <select name="entry.519580628">
                <option>Lune de miel / voyage romantique</option>
                <option>Anniversaire ou occasion spéciale</option>
                <option>Vacances en famille</option>
                <option>Voyage entre amis</option>
                <option>Retraite / bien-être personnel</option>
                <option>Bleisure (affaires + loisirs)</option>
                <option>Autre</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ambiance recherchée</label>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" name="entry.200808887" value="Plages & nature">
                    <span>Plages & nature</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="entry.200808887" value="Aventure & sensations fortes">
                    <span>Aventure & sensations fortes</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="entry.200808887" value="Excursions maritimes & îles">
                    <span>Excursions maritimes & îles</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="entry.200808887" value="Vie nocturne & festivals">
                    <span>Vie nocturne & festivals</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="entry.200808887" value="Gastronomie & vignobles">
                    <span>Gastronomie & vignobles</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="entry.200808887" value="Culture & immersion locale">
                    <span>Culture & immersion locale</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="entry.200808887" value="Bien-être & détente">
                    <span>Bien-être & détente</span>
                </label>
            </div>
        </div>

        <!-- ── LOGISTIQUE ── -->

        <div class="form-group">
            <label>Type de logement</label>
            <select name="entry.284117826">
                <option>Hôtel de luxe</option>
                <option>Hôtel confortable</option>
                <option>Villa / Airbnb privé</option>
            </select>
        </div>

        <div class="form-group">
            <label>Budget approximatif</label>
            <select name="entry.635287828">
                <option>5 000$ à 10 000$ CAD</option>
                <option>10 000$ à 20 000$ CAD</option>
                <option>20 000$ à 40 000$ CAD</option>
                <option>40 000$+ CAD</option>
            </select>
        </div>

        <div class="form-group">
            <label>Billets d'avion</label>
            <select name="entry.1521082274">
                <option>Je préfère les acheter moi-même</option>
                <option>Je souhaite une prise en charge complète</option>
            </select>
        </div>

        <!-- ── SANTÉ ET ALIMENTATION ── -->

        <div class="form-group">
            <label>Restrictions alimentaires ou allergies</label>
            <select name="entry.957170961">
                <option>Aucune</option>
                <option>Oui (merci de préciser ci-dessous)</option>
            </select>
        </div>

        <!-- ── DÉCOUVERTE ── -->

        <div class="form-group">
            <label>Comment avez-vous découvert Floripa Signature ?</label>
            <select name="entry.1430194407">
                <option>Instagram</option>
                <option>Facebook</option>
                <option>Recommandation d'un ami</option>
                <option>Agence partenaire</option>
                <option>Google</option>
                <option>Autre</option>
            </select>
        </div>

        <!-- ── NOTES ── -->

        <div class="form-group">
            <label>Précisions complémentaires</label>
            <textarea
                name="entry.256284772"
                placeholder="Préférences, allergies, attentes particulières, occasions spéciales..."
            ></textarea>
        </div>


        <button type="submit" class="gold-button">
            Envoyer la demande
        </button>

      <div id="success" style="display: none;">
        <span>Merci. Nous vous contacterons prochainement.!</span>
    </div>


    </form>

   
</section>

<script>
    document.querySelector('#planning-form').addEventListener('submit', function() {
        setTimeout(function() {
           document.getElementById('success').style.display = 'block';

           setTimeout(function() {
               document.getElementById('success').style.display = 'none';
               document.querySelector('#planning-form').reset();
           }, 3000);
        }, 1000);
    });
</script>

</body>
</html>
